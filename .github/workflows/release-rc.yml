name: Release RC

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    # Run for release notes or changes to this workflow.
    paths:
      - '.changeset/*.md'
      - '!.changeset/README.md'
      - '.changeset/pre/*.md'
      - '.github/workflows/release-rc.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    name: Release RC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install
        env:
          NPMRC_FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.NPMRC_FONTAWESOME_PACKAGE_TOKEN }}

      - name: Check for Changesets
        id: check-changesets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const ignoredFiles = new Set(['readme.md', 'agents.md', 'claude.md', 'gemini.md']);
          const pending = fs.readdirSync('.changeset', { withFileTypes: true }).filter(file =>
            file.isFile() && file.name.endsWith('.md') && !ignoredFiles.has(file.name.toLowerCase())
          );
          const preState = fs.existsSync('.changeset/pre.json')
            ? JSON.parse(fs.readFileSync('.changeset/pre.json', 'utf8'))
            : undefined;

          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `count=${pending.length}\nprerelease=${preState?.mode === 'pre'}\n`
          );
          NODE

      - name: Enter Prerelease Mode and Version
        if: steps.check-changesets.outputs.count > 0
        run: |
          if [ "${{ steps.check-changesets.outputs.prerelease }}" != "true" ]; then
            npm run changeset:enter-prerelease
          fi
          # Manually run versioning here to update package.json files in the runner
          npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMRC_FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.NPMRC_FONTAWESOME_PACKAGE_TOKEN }}

      - name: Commit version changes
        if: steps.check-changesets.outputs.count > 0
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version bump for RC [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (RC)
        if: steps.check-changesets.outputs.count > 0 || steps.check-changesets.outputs.prerelease == 'true'
        id: changesets
        uses: changesets/action@v2
        with:
          # Versioning above consumes pending changesets; v2 understands the prerelease archive.
          publish-script: npm run changeset:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPMRC_FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.NPMRC_FONTAWESOME_PACKAGE_TOKEN }}
